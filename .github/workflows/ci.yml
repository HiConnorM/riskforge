name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin pnpm + Node to match `packageManager` in root package.json.
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 20

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @prisma/client is a generated artifact — generate it so the database
      # package (and anything importing it) typechecks like it does locally.
      - name: Generate Prisma client
        run: pnpm --filter @riskforge/database db:generate

      - name: Typecheck (all packages, including web)
        run: pnpm -r typecheck

      - name: Prisma schema validate + format check
        run: |
          pnpm --filter @riskforge/database exec prisma validate
          pnpm --filter @riskforge/database exec prisma format --check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run unit + integration tests. No Redis needed — infra is mocked.
      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test

  build-web:
    name: Build web (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @riskforge/web build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

  # Boot the real pipeline (Redis → API → worker) and assert a simulation
  # request flows all the way through: enqueue → worker → engine → result.
  # Also guards the stress-application contract (see .github/scripts/smoke-e2e.mjs).
  smoke:
    name: Smoke (request → queue → worker → result)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Redis + Postgres
        run: pnpm deps:up

      - name: Wait for Redis to be ready
        run: |
          for i in {1..30}; do
            if docker exec $(docker ps -qf "ancestor=redis:7-alpine") redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Redis failed to become ready"
          exit 1

      - name: Boot API + worker
        run: |
          (cd apps/api && PORT=3001 npx tsx src/server.ts > /tmp/api.log 2>&1 &)
          (cd apps/worker && npx tsx src/worker.ts > /tmp/worker.log 2>&1 &)
          for i in {1..30}; do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy"
          cat /tmp/api.log
          exit 1

      - name: "E2E: request → queue → worker → result"
        run: node .github/scripts/smoke-e2e.mjs

      - name: Print service logs on failure
        if: failure()
        run: |
          echo "=== api.log ===";    cat /tmp/api.log    || true
          echo "=== worker.log ==="; cat /tmp/worker.log || true

      - name: Tear down
        if: always()
        run: pnpm deps:down
